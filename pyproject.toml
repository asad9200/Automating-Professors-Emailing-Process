[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emailering"
version = "0.1.0"
description = "An agentic assistant for professor outreach"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.22",
    "streamlit>=1.41.0",
    "tldextract>=5.1.0",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "google-auth-httplib2>=0.4.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langchain-groq>=1.1.3",
    "ddgs>=9.16.0",
    "playwright>=1.48.0",
]

[project.scripts]
profreach = "profreach.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
